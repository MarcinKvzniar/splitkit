[project]
name = "optimization-methods-final-project"
version = "0.1.0"
description = "Metaheuristic optimization of group-aware stratified splitting for imbalanced hierarchical datasets"
authors = [
    { name = "Marcin Kuźniar" },
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.0",
    "pandas>=2.0",
    "pillow>=10.0",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
preview = true
select = ["E", "F", "W", "I"]
extend-select = ["E221", "E222", "E241", "E242"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
