[project]
name = "splitkit"
dynamic = ["version"]
description = "Group-aware stratified dataset splitting: leakage-free train/val/test splits that preserve class distributions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Marcin Kuźniar" },
]
keywords = [
    "machine-learning", "dataset", "train-test-split", "stratification",
    "cross-validation", "data-leakage", "group-kfold", "scikit-learn",
    "bioinformatics", "medical-imaging",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
pandas  = ["pandas>=1.5"]
sklearn = ["scikit-learn>=1.1"]
viz     = ["matplotlib>=3.6"]
exact   = ["scipy>=1.10"]
all     = ["splitkit[pandas,sklearn,viz,exact]"]

[project.scripts]
splitkit = "splitkit.cli:main"

[project.urls]
Homepage      = "https://github.com/MarcinKvzniar/splitkit"
Repository    = "https://github.com/MarcinKvzniar/splitkit"
Issues        = "https://github.com/MarcinKvzniar/splitkit/issues"
Changelog     = "https://github.com/MarcinKvzniar/splitkit/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-benchmark",
    "hypothesis>=6.100",
    "ruff>=0.15",
    "mypy>=1.10",
    "build",
    "twine",
]
bench = ["matplotlib>=3.6", "pandas>=1.5", "pillow>=10.0", "scikit-learn>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/splitkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/splitkit"]

[tool.hatch.build.targets.sdist]
include = ["src/splitkit", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]
exclude = ["benchmarks", "datasets", "results", "docs", "examples", "uv.lock", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: long-running tests",
    "exact: requires SciPy (the exact extra)",
    "sklearn: requires scikit-learn",
]

[tool.coverage.run]
source = ["splitkit"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
preview = true
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "NPY"]
extend-select = ["E221", "E222", "E241", "E242"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# run_benchmark.py must call warnings.filterwarnings before importing sklearn
"benchmarks/*" = ["T201", "E402"]
# Tests assert exact zeros deliberately: a zero-weight mask, |t-t|, and exactly
# representable sums are exact by construction, and approximation would weaken them.
"tests/*" = ["S101", "RUF069"]

[tool.mypy]
python_version = "3.10"
files = ["src/splitkit"]
strict = true

[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "matplotlib.*", "scipy.*"]
ignore_missing_imports = true
